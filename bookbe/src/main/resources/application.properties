spring.application.name=bookbe
server.port=${SERVER_PORT:8080}
spring.threads.virtual.enabled=true 
# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:01269258179}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Liquibase Migration Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Tắt banner Spring Boot khi khởi chạy để giảm bớt thông tin không cần thiết
spring.main.banner-mode=off

# Cấu hình Mức độ Log (Logging Level)
# Giảm thiểu các log khởi động trùng lặp và không cần thiết từ khung Spring/Hibernate
logging.level.root=INFO
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Mức độ Log ứng dụng chính và AOP Logging Aspect
logging.level.com.example.bookbe=INFO
logging.level.com.example.bookbe.aspect=INFO

# Đọc biến từ file .env (kèm giá trị mặc định đằng sau dấu :)
app.jwt.secret=${JWT_SECRET:9a2f8c4e6b1d3a5f7e9c2b4a6d8f1e3c5a7b9d2e4f6a8c0b2d4e6f8a1c3b5d7e}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

google.client.id=${GOOGLE_CLIENT_ID:980684942933-fo9k6e1spr3ipp7m74aedq5v6hfs631h.apps.googleusercontent.com}
