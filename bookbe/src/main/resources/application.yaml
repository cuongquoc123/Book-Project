server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bookbe

  threads:
    virtual:
      enabled: true

  # Database Configuration (MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:01269258179}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Liquibase Migration Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Banner Configuration
  main:
    banner-mode: off

  # Mail Server Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure: WARN
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    com.example.bookbe: INFO
    com.example.bookbe.aspect: INFO

# App Configurations
app:
  jwt:
    secret: ${JWT_SECRET:9a2f8c4e6b1d3a5f7e9c2b4a6d8f1e3c5a7b9d2e4f6a8c0b2d4e6f8a1c3b5d7e}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
    reset-password-token-expiration-ms: ${JWT_RESET_PASSWROD_EXPIRATION_MS:900000}
    verify-mail-token-expiration-ms: ${JWT_VERIFY_MAIL:900000}
  
  rate-limit:
    token:
      max-requests: ${RATE_LIMIT_TOKEN_MAX_REQUESTS:60}
      window-seconds: ${RATE_LIMIT_TOKEN_WINDOW_SECONDS:60}
    ip:
      max-requests: ${RATE_LIMIT_IP_MAX_REQUESTS:100}
      window-seconds: ${RATE_LIMIT_IP_WINDOW_SECONDS:60}
    refresh:
      max-requests: ${RATE_LIMIT_REFRESH_MAX_REQUESTS:3}
      window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
    ip-block-seconds: ${RATE_LIMIT_IP_BLOCK_SECONDS:1800}

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:980684942933-fo9k6e1spr3ipp7m74aedq5v6hfs631h.apps.googleusercontent.com}